

- name: vhost.d dirs
  block:
    - name: ensure env dir exists (and is writable by vagrant)
      become: true
      ansible.builtin.file:
        path: "{{ compose_dir }}/env"
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0775"
    - name: ensure env/vhost.d dir exists (and is writable by vagrant)
      become: true
      ansible.builtin.file:
        path: "{{ compose_dir }}/env/vhost.d"
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0775"
  when: variable_host == 'node'


- name: set uid/gid for docker compose in .env
  ansible.builtin.lineinfile:
    path: "{{ code_dir }}/{{ use_project }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
  loop:
    - { key: "UID", value: "{{ ansible_user_uid }}" }
    - { key: "GID", value: "{{ ansible_user_gid }}" }
  delegate_to: localhost
  run_once: true
     

- name: check if env file exists
  ansible.builtin.stat:
    path: "{{ code_dir }}/{{ use_project }}/.env"
  register: env_file_stat

# Docker creates a missing bind-mount source as root:root mode 0755.
# playwright-mcp runs as uid 1000 and cannot write screenshots there.
# control sets ansible_become: false, which overrides task become, so chmod
# through the Docker daemon instead of sudo.
- name: check playwright output dir
  ansible.builtin.stat:
    path: /tmp/playwright-mcp
  register: playwright_output_dir

- name: ensure playwright output dir is writable
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --platform
      - "{{ 'linux/arm64' if use_arch == 'pi' else 'linux/amd64' }}"
      - -v
      - /tmp/playwright-mcp:/output
      - alpine:latest
      - chmod
      - "1777"
      - /output
  when: >
    not playwright_output_dir.stat.exists or
    playwright_output_dir.stat.mode != '1777'

- name: boot
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}"
    state: present
    remove_orphans: true
    build: always
    env_files: "{{ env_file_stat.stat.exists | ternary([code_dir ~ '/' ~ use_project ~ '/.env'], omit) }}"
    files: "{{ compose_files }}"
 
 